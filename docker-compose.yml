services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://flashcards:flashcards@db:5432/flashcards
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=flashcards
      - POSTGRES_PASSWORD=flashcards
      - POSTGRES_DB=flashcards
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
